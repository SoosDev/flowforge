[build]
builder = "dockerfile"
dockerfilePath = "apps/api/Dockerfile"

[deploy]
startCommand = "node dist/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on-failure"
restartPolicyMaxRetries = 3

# Worker service: set dockerfilePath = "apps/worker/Dockerfile" in Railway dashboard
# Dashboard service: set dockerfilePath = "apps/dashboard/Dockerfile" in Railway dashboard
# Dashboard build args: VITE_API_URL = <your Railway API service public URL>
